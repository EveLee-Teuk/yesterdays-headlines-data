name: Daily News Fetcher

on:
  schedule:
    # 每天 UTC 时间 16:00 运行（对应北京时间每天凌晨 00:10）
    - cron: '20 16 * * *'
  workflow_dispatch: # 这个指令非常重要：允许我们手动点击按钮立刻运行测试！

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许机器人把生成的数据文件提交回仓库

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装依赖包 (requests)
      run: pip install -r requirements.txt

    - name: 4. 运行抓取脚本
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} # 从保险箱偷偷拿出钥匙
      run: python fetch_history.py

   

    - name: 5. 将新数据提交到仓库
      run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add today_news.json
          git commit -m "🚀 自动更新今日历史数据" || exit 0
          git pull --rebase origin main  # 核心修复方案：在推送前强制同步远程最新状态
          git push
