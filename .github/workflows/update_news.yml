name: Collect and publish daily history
on:
  schedule:
    - cron: '15 0,8,16 * * *' # Beijing 00:15, 08:15, 16:15; may be delayed
  workflow_dispatch:
    inputs:
      backfill_budget:
        description: 'Historical dates to retry this run (0-6; today always runs)'
        required: true
        default: '2'
        type: choice
        options: ['0', '1', '2', '3', '4', '5', '6']
      prepare_budget:
        description: 'Missing dates in the upcoming week to prepare (0-7)'
        required: true
        default: '2'
        type: choice
        options: ['0', '1', '2', '3', '4', '5', '6', '7']
  push:
    branches: [main]
    paths: ['catalog.json', 'source_hints.json', '*.py', 'requirements.txt', 'tests/**', '.github/workflows/update_news.yml']
  pull_request:
    paths: ['catalog.json', 'source_hints.json', '*.py', 'requirements.txt', 'tests/**', '.github/workflows/update_news.yml']
concurrency:
  group: history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Re-runs retain the trigger SHA, but daily publication must build on
          # the latest branch data. PR checks still test their exact merge SHA.
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: pip install -r requirements.txt
      - name: Search originals and verify event dates
        if: github.event_name != 'pull_request'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUNBUFFERED: '1'
          BACKFILL_BUDGET: ${{ inputs.backfill_budget || '2' }}
          PREPARE_BUDGET: ${{ inputs.prepare_budget || '2' }}
        run: python archive_window.py --days 7 --backfill-budget "$BACKFILL_BUDGET" --prepare-budget "$PREPARE_BUDGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-history
          path: |
            catalog.json
            issue.json
            collection_status.json
            archive_index.json
            archives/
            window_status.json
            collection_diagnostics/
            prepared/
            preparation_state.json
            coverage_status.json
      - name: Commit validated issue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add catalog.json collection_status.json today_news.json issue.json archives/ archive_index.json window_status.json prepared/ preparation_state.json coverage_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish source-reviewed daily history"
          git push origin HEAD:main
      - name: Report incomplete collection after preserving successful issues
        if: github.event_name != 'pull_request'
        run: python -c "import json; s=json.load(open('window_status.json')); assert s['todayMinimumMet'] and not s['failedDates'], 'Daily minimum or attempted backfill failed; see window_status.json'"
