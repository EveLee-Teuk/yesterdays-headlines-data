name: Collect and publish daily history
on:
  schedule:
    - cron: '15 16 * * *' # Beijing 00:15; scheduling may be delayed
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['catalog.json', '*.py', 'requirements.txt', 'tests/**', '.github/workflows/update_news.yml']
  pull_request:
    paths: ['catalog.json', 'fetch_history.py', 'tests/**', '.github/workflows/update_news.yml']
concurrency:
  group: history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: pip install -r requirements.txt
      - name: Search originals and verify event dates
        if: github.event_name != 'pull_request'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python collect_history.py
      - run: python fetch_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-history
          path: |
            catalog.json
            issue.json
            collection_status.json
      - name: Commit validated issue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add catalog.json collection_status.json today_news.json issue.json archives/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish source-reviewed daily history"
          git push
